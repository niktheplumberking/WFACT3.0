name: Cockpit job

# Runs ONE Cockpit-requested job (public.jobs, migration 0009): intake, replan, build_plan, resume,
# verify or ask. Dispatched only by the `dispatch-job` Supabase Edge Function after it has checked the
# requester is an owner/admin and the job is theirs and still queued.
#
# Injection safety: the only input is `job_id`. It is passed through `env` (never interpolated into a
# script with ${{ }}), validated as a UUID before anything else runs, and the runner reads every other
# parameter from the database row the jobs trigger already validated. Secrets come from Doppler
# (DOPPLER_TOKEN, prd config) exactly like the deploy job — nothing else is stored in GitHub.

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "public.jobs id (UUID) — set by the dispatch-job Edge Function"
        required: true
        type: string

run-name: "Cockpit job ${{ inputs.job_id }}"

permissions:
  contents: read

concurrency:
  group: cockpit-job-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  run:
    name: Run Cockpit job
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JOB_ID: ${{ inputs.job_id }}
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - name: Validate job id (UUID only)
        run: |
          if [[ ! "$JOB_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "::error::job_id is not a UUID — refusing to run."
            exit 1
          fi
          if [ -z "$DOPPLER_TOKEN" ]; then
            echo "::error::DOPPLER_TOKEN secret is not set — see docs/SECRETS.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dopplerhq/cli-action@v3

      - name: "Install packages (dependency order; file: links don't install linked deps)"
        run: for p in audit hermes agent-runtime documentation frontend-loop verification planning rendered-qa workflow jobs; do (cd "packages/$p" && npm ci --no-audit --no-fund); done

      # Step 4B M4: a Track B build installs the starter with `npm ci --offline` inside a network sandbox
      # with an allow-listed environment (DOPPLER_TOKEN and every Doppler secret stay outside it). This
      # step fills the package cache it reads from.
      - name: Warm the package cache with the Track B starter's pinned packages
        working-directory: packages/frontend-loop/starters/track-b
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Step 4B M1: QA renders every built page in headless Chromium (screenshots, axe, Lighthouse).
      - name: Install Chromium for rendered QA
        working-directory: packages/rendered-qa
        run: npx playwright install --with-deps chromium

      # Step 4D: the job as a whole stops at 30 minutes and nothing after it runs, so the safety net below could never fire on a
      # timeout and the Cockpit showed "Running" forever. This step stops at 26 minutes instead; the net then marks the job failed
      # while the run's saved site (linked to the job at start, `job.run`) can still be continued from the Cockpit.
      - name: Run job
        timeout-minutes: 26
        working-directory: packages/jobs
        run: doppler run -- npx tsx src/run.ts "$JOB_ID"

      # Safety net: if anything above crashed before the runner recorded an outcome, the job must not
      # sit in "running" forever in the Cockpit.
      - name: Mark job failed if it never finished
        if: failure() || cancelled()
        working-directory: packages/jobs
        run: doppler run -- npx tsx src/run.ts "$JOB_ID" --mark-failed
