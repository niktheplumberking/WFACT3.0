name: CI

# Phase 1 skeleton (Operator's Manual: "base CI pipeline skeleton"). Runs on every push and PR.
# Registry/check gates are required status checks, not advisory (Ecosystem Blueprint §15) — as real
# checks get added (Phase 5 onward), wire them in here as required jobs, don't leave them optional.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  guardrails:
    name: Repo law & structure guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secrets scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify required law/memory files exist
        run: |
          set -e
          for f in CLAUDE.md PROGRESS.md BLOCKED-ON-NICK.md memory/context.md memory/lessons-ledger.md; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              exit 1
            fi
          done
          echo "All required law/memory files present."

      - name: Block plaintext secrets in tracked files
        run: |
          # .env.example files are shape-only templates and are meant to be tracked. This regex had
          # matched them too (a false positive), which went unnoticed until CI's first real run on main,
          # 2026-09-28. Any other .env / .env.* file still fails the build.
          if [ -f .env ] || git ls-files | grep -E '(^|/)\.env($|\.[^.]*$)' | grep -qvE '(^|/)\.env\.example$' ; then
            echo "::error::A .env file is tracked in git. Secrets must never be committed — see CLAUDE.md §6."
            exit 1
          fi
          echo "No tracked .env files found."

  # Phase 3: the first real, required (non-advisory) check job — Ecosystem Blueprint §15.
  # No network calls, no credentials needed (see packages/hermes/README.md verification table);
  # a live Claude/Supabase check stays a manual step until ANTHROPIC_API_KEY/SUPABASE_SERVICE_ROLE_KEY
  # land, per BLOCKED-ON-NICK.md.
  hermes:
    name: Hermes-lite — typecheck + unit tests
    runs-on: ubuntu-latest
    needs: guardrails
    defaults:
      run:
        working-directory: packages/hermes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  # Phase 4: same pattern as the hermes job above. No network calls, no credentials needed — see
  # packages/frontend-loop's test suite (builder/evaluator loop against a MockModelClient); the
  # live Claude run stays a manual step until ANTHROPIC_API_KEY lands, per BLOCKED-ON-NICK.md.
  # This job was a tracked gap in PROGRESS.md ("packages/frontend-loop has no CI job") from when
  # the package was committed without one — closed here.
  frontend-loop:
    name: Frontend loop — typecheck + unit tests
    runs-on: ubuntu-latest
    needs: guardrails
    defaults:
      run:
        working-directory: packages/frontend-loop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # file: links don't install the linked package's own deps — install the chain first
      # (agent-runtime -> audit, hermes). Verified with a clean-checkout simulation 2026-09-28.
      - name: Install linked packages (audit, hermes, agent-runtime)
        run: for p in audit hermes agent-runtime; do (cd ../$p && npm ci); done
      - name: Install
        run: npm ci
      # Step 4B M4: the Track B build installs the starter with `npm ci --offline` inside a network sandbox,
      # so the starter's pinned packages must already be in the npm cache. This step (network allowed) is
      # the "package cache"; the build itself never reaches the network.
      - name: Warm the package cache with the Track B starter's pinned packages
        working-directory: packages/frontend-loop/starters/track-b
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (Track B tests run the real isolated Next.js build)
        run: npm test

  # Step 4B M4 acceptance: "the build runs in CI with no secrets in the build step and no network beyond
  # the package cache". This job holds no secrets at all (none are referenced). The build step runs the
  # isolated build (src/trackB/isolate.ts: a network namespace on Linux, an allow-listed environment,
  # `npm ci --offline`), which probes its own isolation first and fails unless the network is unreachable
  # and no unexpected variable is visible; the probe result is printed in the record. The static export is
  # kept as a workflow artifact for inspection.
  track-b-build:
    name: Track B — isolated static build (no secrets, no network)
    runs-on: ubuntu-latest
    needs: guardrails
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/frontend-loop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install linked packages (audit, hermes, agent-runtime)
        run: for p in audit hermes agent-runtime; do (cd ../$p && npm ci); done
      - name: Install
        run: npm ci
      # Step 4B M4: the Track B build installs the starter with `npm ci --offline` inside a network sandbox,
      # so the starter's pinned packages must already be in the npm cache. This step (network allowed) is
      # the "package cache"; the build itself never reaches the network.
      - name: Warm the package cache with the Track B starter's pinned packages
        working-directory: packages/frontend-loop/starters/track-b
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Isolated Track B build of the SYNTHETIC Northfold fixture
        env:
          WFACT_CANARY: "if this name appears in the build record, the environment leaked"
        run: |
          npm run build-track-b -- test/fixtures/track-b/northfold.brief.json test/fixtures/track-b/northfold.content.json "$RUNNER_TEMP/track-b-out" | tee "$RUNNER_TEMP/track-b-record.json"
          if grep -q WFACT_CANARY "$RUNNER_TEMP/track-b-record.json"; then echo "::error::the build saw a variable from the job environment"; exit 1; fi
          grep -q '"network": "blocked"' "$RUNNER_TEMP/track-b-record.json"
          test -f "$RUNNER_TEMP/track-b-out/index.html" && test -f "$RUNNER_TEMP/track-b-out/services/index.html" && test -f "$RUNNER_TEMP/track-b-out/contact/index.html"
      - uses: actions/upload-artifact@v4
        with:
          name: track-b-static-export
          path: |
            ${{ runner.temp }}/track-b-out
            ${{ runner.temp }}/track-b-record.json
          retention-days: 14

  # Phase 5: the check registry runs for real here — this is the Manual's own Phase 5 exit check
  # ("a deliberately broken test build gets caught and returned before being marked done") proven
  # on every push, not just asserted once locally. No network calls, no credentials needed for the
  # 6 deterministic checks; the evaluator step's live run stays manual until ANTHROPIC_API_KEY
  # lands, per BLOCKED-ON-NICK.md — see packages/verification/README.md.
  verification:
    name: Verification loop — typecheck + unit tests
    runs-on: ubuntu-latest
    needs: guardrails
    defaults:
      run:
        working-directory: packages/verification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install linked packages (audit, hermes, agent-runtime)
        run: for p in audit hermes agent-runtime; do (cd ../$p && npm ci); done
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  # Continuation Plan Stage 3: build-and-verify workflow — includes the Blueprint Phase 6 proof that
  # a deliberately broken stage-1 output is caught before stage two, and checkpoint resume.
  workflow:
    name: Workflow (build → verify) — typecheck + unit tests
    runs-on: ubuntu-latest
    needs: guardrails
    defaults:
      run:
        working-directory: packages/workflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install linked packages (audit, hermes, agent-runtime, frontend-loop, verification, planning)
        run: for p in audit hermes agent-runtime frontend-loop verification planning rendered-qa; do (cd ../$p && npm ci); done
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  # Continuation Plan Stage 4: Intake (fast tier) + Planner (mid tier) on the shared runtime; model
  # choice from Hermes-lite's routing config. Mock models only — no credentials needed.
  planning:
    name: Planning (Intake + Planner) — typecheck + unit tests
    runs-on: ubuntu-latest
    needs: guardrails
    defaults:
      run:
        working-directory: packages/planning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install linked packages (audit, hermes, agent-runtime, frontend-loop)
        run: for p in audit hermes agent-runtime frontend-loop; do (cd ../$p && npm ci); done
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  # Step 4B M1: rendered QA (headless Chromium, axe, Lighthouse, design rulebook detectors) and the
  # cross-vendor screenshot reviewer. The browser tests run for real against committed fixtures; the
  # reviewer's tests mock the network, so this job needs no secrets and spends nothing.
  rendered-qa:
    name: Rendered QA — typecheck + browser tests
    runs-on: ubuntu-latest
    needs: guardrails
    # A hung browser must fail in minutes, not hold the job for GitHub's 6-hour default (first run, 2026-10-01).
    # 30 since Step 4B M4 (the Track B acceptance tests build a real site and run five browser fixtures).
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/rendered-qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install linked packages (audit, hermes, agent-runtime, frontend-loop, verification)
        # frontend-loop: the Step 4B M3 Track A test renders its fixture site with the committed starter.
        run: for p in audit hermes agent-runtime frontend-loop verification; do (cd ../$p && npm ci); done
      - name: Install
        run: npm ci
      # Step 4B M4: the Track B build installs the starter with `npm ci --offline` inside a network sandbox,
      # so the starter's pinned packages must already be in the npm cache. This step (network allowed) is
      # the "package cache"; the build itself never reaches the network.
      - name: Warm the package cache with the Track B starter's pinned packages
        working-directory: packages/frontend-loop/starters/track-b
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Fixtures are up to date (regenerate and diff)
        run: npm run fixtures && git diff --exit-code -- ../frontend-loop/design/fixtures ../verification/test/fixtures/claims test/fixtures
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (real Chromium)
        run: npm test

  # Cockpit jobs runner (packages/jobs) — the code .github/workflows/cockpit-job.yml executes.
  jobs-runner:
    name: Cockpit jobs runner — typecheck + unit tests
    runs-on: ubuntu-latest
    needs: guardrails
    defaults:
      run:
        working-directory: packages/jobs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install linked packages
        run: for p in audit hermes agent-runtime frontend-loop verification planning rendered-qa workflow; do (cd ../$p && npm ci); done
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  # Continuation Plan Stage 2: the shared agent lifecycle (Agent interface, runAgent, registry).
  agent-runtime:
    name: Agent runtime — typecheck + unit tests
    runs-on: ubuntu-latest
    needs: guardrails
    defaults:
      run:
        working-directory: packages/agent-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install linked packages (audit, hermes)
        run: for p in audit hermes; do (cd ../$p && npm ci); done
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  # Continuation Plan Stage 1: the append-only audit writer hermes + verification link via
  # file:../audit. Zero runtime deps, no network, no credentials — same pattern as the jobs above.
  audit:
    name: Audit writer — typecheck + unit tests
    runs-on: ubuntu-latest
    needs: guardrails
    defaults:
      run:
        working-directory: packages/audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  # Replaces the Day-1 placeholder now that apps/cockpit exists (Phase 6). Builds without any
  # env vars on purpose — VITE_SUPABASE_* are only needed at runtime, and the real deploy below
  # pulls them from the Vercel project, not from CI.
  build:
    name: Cockpit — typecheck + production build
    runs-on: ubuntu-latest
    needs: guardrails
    defaults:
      run:
        working-directory: apps/cockpit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Component and flow tests (Step 4C)
        run: npm test
      - name: Build (tsc -b && vite build)
        run: npm run build
      - name: No service key in the browser bundle
        run: |
          if grep -rl "service_role" dist; then echo "::error::service_role found in the Cockpit bundle"; exit 1; fi

  # Continuation Plan Stage 1 / Blueprint Phase 0 acceptance: "a commit can go from a laptop to a
  # deployed preview through CI with zero manual steps." Runs only on a push to trunk (main), and
  # only after every check job above passed — registry gates are required, not advisory (§15).
  #
  # Secrets: the only GitHub secret is DOPPLER_TOKEN (a Doppler service token scoped to the
  # wfact/prd config). VERCEL_TOKEN lives in Doppler, never in GitHub or the repo (Blueprint §12).
  # Org/project IDs are identifiers, not secrets — same values as apps/cockpit/.vercel/project.json.
  deploy-cockpit:
    name: Deploy Cockpit to Vercel (trunk only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [guardrails, audit, hermes, agent-runtime, frontend-loop, track-b-build, verification, rendered-qa, workflow, planning, jobs-runner, build]
    concurrency:
      group: deploy-cockpit
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: team_59lA2tP4DaHNBErHnfnggRdc
      VERCEL_PROJECT_ID: prj_wUFAYfzJtFgX7SG7XC7ptKDoOWrb
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require the Doppler token (fail loudly, never skip silently)
        run: |
          if [ -z "$DOPPLER_TOKEN" ]; then
            echo "::error::DOPPLER_TOKEN secret is not set — see docs/SECRETS.md. Refusing to deploy."
            exit 1
          fi
      - uses: dopplerhq/cli-action@v3
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel production settings + env
        run: doppler run --command 'vercel pull --yes --environment=production --token "$VERCEL_TOKEN"'
      - name: Build
        run: doppler run --command 'vercel build --prod --token "$VERCEL_TOKEN"'
      - name: Deploy
        id: deploy
        run: |
          url=$(doppler run --command 'vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"
      # Never trust done, only verified (CLAUDE.md §1): the deploy isn't done until it answers.
      - name: Smoke-check the live deployment
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "${{ steps.deploy.outputs.url }}")
          echo "HTTP $code from ${{ steps.deploy.outputs.url }}"
          test "$code" = "200"
