name: CI

# Phase 1 skeleton (Operator's Manual: "base CI pipeline skeleton"). Runs on every push and PR.
# Registry/check gates are required status checks, not advisory (Ecosystem Blueprint §15) — as real
# checks get added (Phase 5 onward), wire them in here as required jobs, don't leave them optional.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  guardrails:
    name: Repo law & structure guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secrets scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify required law/memory files exist
        run: |
          set -e
          for f in CLAUDE.md PROGRESS.md BLOCKED-ON-NICK.md memory/context.md memory/lessons-ledger.md; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              exit 1
            fi
          done
          echo "All required law/memory files present."

      - name: Block plaintext secrets in tracked files
        run: |
          if [ -f .env ] || git ls-files | grep -qE '(^|/)\.env($|\.[^.]*$)' ; then
            echo "::error::A .env file is tracked in git. Secrets must never be committed — see CLAUDE.md §6."
            exit 1
          fi
          echo "No tracked .env files found."

  # Phase 3: the first real, required (non-advisory) check job — Ecosystem Blueprint §15.
  # No network calls, no credentials needed (see packages/hermes/README.md verification table);
  # a live Claude/Supabase check stays a manual step until ANTHROPIC_API_KEY/SUPABASE_SERVICE_ROLE_KEY
  # land, per BLOCKED-ON-NICK.md.
  hermes:
    name: Hermes-lite — typecheck + unit tests
    runs-on: ubuntu-latest
    needs: guardrails
    defaults:
      run:
        working-directory: packages/hermes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  # Phase 4: same pattern as the hermes job above. No network calls, no credentials needed — see
  # packages/frontend-loop's test suite (builder/evaluator loop against a MockModelClient); the
  # live Claude run stays a manual step until ANTHROPIC_API_KEY lands, per BLOCKED-ON-NICK.md.
  # This job was a tracked gap in PROGRESS.md ("packages/frontend-loop has no CI job") from when
  # the package was committed without one — closed here.
  frontend-loop:
    name: Frontend loop — typecheck + unit tests
    runs-on: ubuntu-latest
    needs: guardrails
    defaults:
      run:
        working-directory: packages/frontend-loop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  # Phase 5: the check registry runs for real here — this is the Manual's own Phase 5 exit check
  # ("a deliberately broken test build gets caught and returned before being marked done") proven
  # on every push, not just asserted once locally. No network calls, no credentials needed for the
  # 6 deterministic checks; the evaluator step's live run stays manual until ANTHROPIC_API_KEY
  # lands, per BLOCKED-ON-NICK.md — see packages/verification/README.md.
  verification:
    name: Verification loop — typecheck + unit tests
    runs-on: ubuntu-latest
    needs: guardrails
    defaults:
      run:
        working-directory: packages/verification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  # Continuation Plan Stage 1: the append-only audit writer hermes + verification link via
  # file:../audit. Zero runtime deps, no network, no credentials — same pattern as the jobs above.
  audit:
    name: Audit writer — typecheck + unit tests
    runs-on: ubuntu-latest
    needs: guardrails
    defaults:
      run:
        working-directory: packages/audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  # Replaces the Day-1 placeholder now that apps/cockpit exists (Phase 6). Builds without any
  # env vars on purpose — VITE_SUPABASE_* are only needed at runtime, and the real deploy below
  # pulls them from the Vercel project, not from CI.
  build:
    name: Cockpit — typecheck + production build
    runs-on: ubuntu-latest
    needs: guardrails
    defaults:
      run:
        working-directory: apps/cockpit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Build (tsc -b && vite build)
        run: npm run build

  # Continuation Plan Stage 1 / Blueprint Phase 0 acceptance: "a commit can go from a laptop to a
  # deployed preview through CI with zero manual steps." Runs only on a push to trunk (main), and
  # only after every check job above passed — registry gates are required, not advisory (§15).
  #
  # Secrets: the only GitHub secret is DOPPLER_TOKEN (a Doppler service token scoped to the
  # wfact/prd config). VERCEL_TOKEN lives in Doppler, never in GitHub or the repo (Blueprint §12).
  # Org/project IDs are identifiers, not secrets — same values as apps/cockpit/.vercel/project.json.
  deploy-cockpit:
    name: Deploy Cockpit to Vercel (trunk only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [guardrails, audit, hermes, frontend-loop, verification, build]
    concurrency:
      group: deploy-cockpit
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: team_59lA2tP4DaHNBErHnfnggRdc
      VERCEL_PROJECT_ID: prj_wUFAYfzJtFgX7SG7XC7ptKDoOWrb
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require the Doppler token (fail loudly, never skip silently)
        run: |
          if [ -z "$DOPPLER_TOKEN" ]; then
            echo "::error::DOPPLER_TOKEN secret is not set — see docs/SECRETS.md. Refusing to deploy."
            exit 1
          fi
      - uses: dopplerhq/cli-action@v3
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel production settings + env
        run: doppler run --command 'vercel pull --yes --environment=production --token "$VERCEL_TOKEN"'
      - name: Build
        run: doppler run --command 'vercel build --prod --token "$VERCEL_TOKEN"'
      - name: Deploy
        id: deploy
        run: |
          url=$(doppler run --command 'vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"
      # Never trust done, only verified (CLAUDE.md §1): the deploy isn't done until it answers.
      - name: Smoke-check the live deployment
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "${{ steps.deploy.outputs.url }}")
          echo "HTTP $code from ${{ steps.deploy.outputs.url }}"
          test "$code" = "200"
