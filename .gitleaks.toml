# gitleaks config for CI's "Secrets scan" step (.github/workflows/ci.yml). All default rules stay on.
#
# One narrow allowlist, added 2026-09-28 after CI run 36429819858 flagged 4 "generic-api-key" hits,
# all in graphify-out/cache/stat-index.json. Investigated, not assumed: every flagged value is exactly
# graphify's own `file_hash()` of a .claude/hooks/*token*.sh script (verified by recomputing it) —
# the rule fires only because those file NAMES contain "token". That file is a derived
# path -> content-hash index and never holds credentials. Do not widen this to all of graphify-out/:
# the graph/wiki embed repo text and must stay scanned.

[extend]
useDefault = true

#
# Second entry, added 2026-10-15 after CI run 38724162336 flagged 6 "generic-api-key" hits, all the same
# made-up UUID used as a lead-form site key in test fixtures (Step 25 M4). A site key is public by design
# (it is in the page source; migration 0025) and this value matches no live lead_sites row (SQL, 0 rows).
# Exact value only: any other key-shaped string is still scanned.

[allowlist]
description = "graphify stat-index (derived hashes) and the synthetic test site key"
paths = ['''^graphify-out/cache/stat-index\.json$''']
regexes = ['''^0b7d3c1e-2a4f-4e6b-9c8d-1f2e3a4b5c6d$''']
